version: "3.9"

services:
  backend:
    build: ./backend
    container_name: tracex-backend
    ports:
      - "8000:8000"
    environment:
      - TRACE_MODE=DEMO
      - JWT_SECRET=tracex-hackathon-secret-2024-mit-aoe
    volumes:
      - /tmp/tracex_reports:/tmp/tracex_reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: tracex-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: tracex-net
